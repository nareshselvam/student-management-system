<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 15px;
        }

        .section-title {
            color: #333;
            margin-bottom: 18px;
            font-size: 22px;
        }

        .form-card {
            background: #f7f8fc;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 35px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .form-row input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .form-row input:focus {
            border-color: #667eea;
        }

        .add-btn {
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            background: #667eea;
            color: white;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #5568d9;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background: #667eea;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            color: #444;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .update-btn {
            background: #f0ad4e;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #d99532;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 25px;
            }

            .form-row {
                flex-direction: column;
            }

            .form-row input,
            .add-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <h1>🎓 Student Management System</h1>
            <p>Manage student records using Node.js, Express and MySQL</p>
        </div>

        <!-- Add Student -->
        <div class="form-card">

            <h2 class="section-title">Add New Student</h2>

            <form id="studentForm">

                <div class="form-row">

                    <input
                        type="text"
                        id="name"
                        placeholder="Student Name"
                        required
                    >

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        required
                    >

                    <input
                        type="text"
                        id="course"
                        placeholder="Course"
                        required
                    >

                    <button type="submit" class="add-btn">
                        + Add Student
                    </button>

                </div>

            </form>

        </div>

        <!-- Student List -->
        <h2 class="section-title">Student Records</h2>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentList">
                </tbody>

            </table>

        </div>

        <div class="footer">
            <p>Student Management System | Full Stack Development Assignment</p>
        </div>

    </div>


    <script>

        // ============================
        // VIEW STUDENTS
        // ============================

        function loadStudents() {

            fetch('/students')
                .then(response => response.json())
                .then(students => {

                    const list = document.getElementById('studentList');

                    list.innerHTML = '';

                    students.forEach(student => {

                        list.innerHTML += `
                            <tr>

                                <td>${student.id}</td>

                                <td>${student.name}</td>

                                <td>${student.email}</td>

                                <td>${student.course}</td>

                                <td>

                                    <button
                                        class="update-btn"
                                        onclick="updateStudent(${student.id})">
                                        ✏️ Update
                                    </button>

                                    <button
                                        class="delete-btn"
                                        onclick="deleteStudent(${student.id})">
                                        🗑️ Delete
                                    </button>

                                </td>

                            </tr>
                        `;

                    });

                });

        }


        // ============================
        // ADD STUDENT
        // ============================

        document
            .getElementById('studentForm')
            .addEventListener('submit', function(event) {

                event.preventDefault();

                const student = {

                    name: document.getElementById('name').value,

                    email: document.getElementById('email').value,

                    course: document.getElementById('course').value

                };


                fetch('/students', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify(student)

                })

                .then(response => response.json())

                .then(data => {

                    alert(data.message);

                    document
                        .getElementById('studentForm')
                        .reset();

                    loadStudents();

                });

            });


        // ============================
        // DELETE STUDENT
        // ============================

        function deleteStudent(id) {

            if (!confirm('Are you sure you want to delete this student?')) {
                return;
            }


            fetch('/students/' + id, {

                method: 'DELETE'

            })

            .then(response => response.json())

            .then(data => {

                alert(data.message);

                loadStudents();

            });

        }


        // ============================
        // UPDATE STUDENT
        // ============================

        function updateStudent(id) {

            const name = prompt(
                'Enter new student name:'
            );

            const email = prompt(
                'Enter new email:'
            );

            const course = prompt(
                'Enter new course:'
            );


            if (!name || !email || !course) {
                return;
            }


            const student = {

                name: name,

                email: email,

                course: course

            };


            fetch('/students/' + id, {

                method: 'PUT',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify(student)

            })

            .then(response => response.json())

            .then(data => {

                alert(data.message);

                loadStudents();

            });

        }


        // Load students when page opens
        loadStudents();

    </script>

</body>

</html>
